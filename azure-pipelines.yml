trigger:
- main

# Do not run this pipeline on pull requests (CI/CD only on main + manual runs).
pr: none

pool:
  vmImage: ubuntu-latest

parameters:
- name: deployNeu
  displayName: Deploy NEU (North Europe) - optional manual deploy
  type: boolean
  default: false
- name: runStryker
  displayName: Run Stryker mutation pilot (opt-in, report-only)
  type: boolean
  default: false
- name: configurePublicDomains
  displayName: Validate DNS and bind public SEC domains
  type: boolean
  default: false

variables:
  buildConfiguration: Release
  projectName: recipelibrary
  ghcrImageRepository: ghcr.io/vincentadvocaat/recipelibrary
  # Per-region Azure service connections: RecipeLibrary-Azure-SEC, RecipeLibrary-Azure-NEU (see docs/azure/pipeline-setup.md).

stages:
- stage: Build
  displayName: Build and test
  jobs:
  - job: BuildAndTest
    displayName: Build, test, container image
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.x

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: Use Node for static welcome validation

    - script: |
        set -euo pipefail
        node --test tests/welcome/startup.test.mjs
        node scripts/build-welcome.mjs
      displayName: Test and build static welcome page

    - script: dotnet restore RecipeLibrary.slnx
      displayName: Restore

    - script: dotnet build RecipeLibrary.slnx --configuration $(buildConfiguration) --no-restore
      displayName: Build

    - script: dotnet test tests/RecipeLibrary.Application.Tests --configuration $(buildConfiguration) --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/TestResults/Coverage --settings tests/coverlet.runsettings
      displayName: Unit tests with coverage

    - task: PublishCodeCoverageResults@2
      displayName: Publish code coverage
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(Agent.TempDirectory)/TestResults/Coverage/**/coverage.cobertura.xml'
        pathToSources: '$(Build.SourcesDirectory)/src'
        failIfCoverageEmpty: true

    - script: dotnet test tests/RecipeLibrary.Web.ComponentTests --configuration $(buildConfiguration) --no-build --verbosity normal
      displayName: Component tests

    - pwsh: ./tests/RecipeLibrary.Web.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      displayName: Install Chromium for welcome page tests

    - script: dotnet test tests/RecipeLibrary.Web.E2E.Tests --configuration $(buildConfiguration) --no-build --filter FullyQualifiedName~WelcomePageTests --verbosity normal
      displayName: Static welcome browser tests

    - script: dotnet test tests/RecipeLibrary.Web.IntegrationTests --configuration $(buildConfiguration) --no-build --verbosity normal
      displayName: Integration tests

    - script: |
        set -euo pipefail
        docker build -f src/Web/RecipeLibrary.Web/Dockerfile -t "$(ghcrImageRepository):build-$(Build.BuildId)" .
      displayName: Build container image (validation)

    - script: |
        set -euo pipefail
        echo "$(GHCR_TOKEN)" | docker login ghcr.io -u "$(GHCR_USERNAME)" --password-stdin
        image_tag="$(ghcrImageRepository):$(Build.SourceVersion)"
        docker build -f src/Web/RecipeLibrary.Web/Dockerfile -t "$image_tag" .
        docker push "$image_tag"
        digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image_tag" | cut -d@ -f2)"
        echo "Published immutable digest: $digest"
        echo "##vso[task.setvariable variable=containerImageDigest;isOutput=true]$digest"
      name: PublishImage
      displayName: Publish container image to GHCR
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))

# Opt-in Stryker is a separate stage so failures never block Build → Deploy.
- stage: Stryker
  displayName: Stryker mutation pilot (opt-in)
  dependsOn: []
  condition: eq(${{ parameters.runStryker }}, true)
  jobs:
  - job: StrykerPilot
    displayName: Stryker mutation pilot
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 10 SDK
      inputs:
        packageType: sdk
        version: 10.x

    - script: |
        set -euo pipefail
        dotnet tool restore
        pwsh -File ./scripts/run-stryker.ps1
      displayName: Run Stryker pilot

    - script: |
        set -euo pipefail
        mkdir -p tests/RecipeLibrary.Application.Tests/StrykerOutput
      displayName: Ensure Stryker output directory
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      displayName: Publish Stryker reports
      condition: succeededOrFailed()
      continueOnError: true
      inputs:
        targetPath: tests/RecipeLibrary.Application.Tests/StrykerOutput
        artifact: stryker-reports

# SEC deploys automatically after Build on main (uses existing environment test-sec).
- stage: DeployTestSEC
  displayName: Deploy test SEC
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  variables:
    containerImageDigest: $[ stageDependencies.Build.BuildAndTest.outputs['PublishImage.containerImageDigest'] ]
  jobs:
  - deployment: DeployTestSEC
    displayName: Deploy test SEC
    environment: test-sec
    variables:
      azureLocation: swedencentral
      resourceGroupName: rg-recipelibrary-test-sec
      environmentName: test-sec
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout repository

          - task: AzureCLI@2
            displayName: Deploy Bicep infrastructure
            inputs:
              azureSubscription: RecipeLibrary-Azure-SEC
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                az bicep install

                if [ -z "$(containerImageDigest)" ]; then
                  echo "containerImageDigest is empty. Ensure the GHCR publish step ran on main."
                  exit 1
                fi

                echo "Verifying resource group exists (pipeline does not create RGs)..."
                az group show --name "$(resourceGroupName)" >/dev/null

                # ARM replaces customDomains. Carry forward existing certificate bindings.
                current_app="$(az containerapp list -g "$(resourceGroupName)" --query "[?starts_with(name, 'ca-rl-')].name | [0]" -o tsv)"
                domains='[]'
                if [ -n "$current_app" ]; then
                  domains="$(az containerapp show -g "$(resourceGroupName)" -n "$current_app" -o json | jq '.properties.configuration.ingress.customDomains // []')"
                fi
                domain_parameters="$(Agent.TempDirectory)/app-domains.json"
                jq -n --argjson domains "$domains" '{appCustomDomains: {value: ($domains // [])}}' > "$domain_parameters"
                deployment_name="main-$(Build.BuildId)"
                outputs="$(az deployment group create \
                  --name "$deployment_name" \
                  --resource-group "$(resourceGroupName)" \
                  --template-file infra/main.bicep \
                  --parameters "@$domain_parameters" \
                    location="$(azureLocation)" \
                    projectName="$(projectName)" \
                    environment="$(environmentName)" \
                    enableWelcome=true \
                    tenantId="$(AZURE_TENANT_ID)" \
                    entraAdminLogin="$(AZURE_ENTRA_ADMIN_LOGIN)" \
                    entraAdminObjectId="$(AZURE_ENTRA_ADMIN_OBJECT_ID)" \
                    ghcrImageRepository="$(ghcrImageRepository)" \
                    containerImageDigest="$(containerImageDigest)" \
                    ghcrUsername="$(GHCR_USERNAME)" \
                    ghcrPassword="$(GHCR_TOKEN)" \
                  --query properties.outputs -o json)"

                container_app_name="$(echo "$outputs" | jq -r '.containerAppName.value')"
                container_app_fqdn="$(echo "$outputs" | jq -r '.containerAppFqdn.value')"
                key_vault_name="$(echo "$outputs" | jq -r '.keyVaultName.value')"
                echo "Deployed Container App: $container_app_name"
                echo "Container App FQDN: $container_app_fqdn"
                echo "Key Vault: $key_vault_name"
                echo "##vso[task.setvariable variable=containerAppName]$container_app_name"
                echo "##vso[task.setvariable variable=containerAppFqdn]$container_app_fqdn"
                echo "##vso[task.setvariable variable=keyVaultName]$key_vault_name"

                welcome_site_name="$(echo "$outputs" | jq -r '.welcomeSiteName.value')"
                welcome_site_hostname="$(echo "$outputs" | jq -r '.welcomeSiteHostname.value')"
                echo "##vso[task.setvariable variable=welcomeSiteName]$welcome_site_name"
                echo "##vso[task.setvariable variable=welcomeSiteHostname]$welcome_site_hostname"

          - task: NodeTool@0
            inputs:
              versionSpec: '22.x'
            displayName: Use Node for welcome deployment

          - task: AzureCLI@2
            displayName: Prepare welcome page and optional domain bindings
            inputs:
              azureSubscription: RecipeLibrary-Azure-SEC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                rg="$(resourceGroupName)"
                app="$(containerAppName)"
                site="$(welcomeSiteName)"
                site_fqdn="$(welcomeSiteHostname)"
                verification="$(az containerapp show -g "$rg" -n "$app" --query properties.customDomainVerificationId -o tsv)"
                echo "CNAME recipelibrary.vasoftware.nl -> $site_fqdn"
                echo "CNAME app-recipelibrary.vasoftware.nl -> $(containerAppFqdn)"
                echo "TXT asuid.app-recipelibrary.vasoftware.nl -> $verification"
                if [[ '${{ parameters.configurePublicDomains }}' =~ ^[Tt]rue$ ]]; then
                  bash scripts/configure-welcome-domains.sh "$rg" "$app" "$site"
                fi
                binding="$(az containerapp hostname list -g "$rg" -n "$app" --query "[?name=='app-recipelibrary.vasoftware.nl'].bindingType | [0]" -o tsv)"
                backend="https://$(containerAppFqdn)"
                if [ "$binding" = 'SniEnabled' ]; then
                  backend='https://app-recipelibrary.vasoftware.nl'
                  curl --fail --silent --show-error --max-time 60 "$backend/health/live" -o /dev/null
                fi
                node scripts/build-welcome.mjs "$backend"
                token="$(az staticwebapp secrets list -g "$rg" -n "$site" --query properties.apiKey -o tsv)"
                echo "##vso[task.setvariable variable=welcomeDeploymentToken;issecret=true]$token"
                echo "##vso[task.setvariable variable=welcomeSiteHostname]$site_fqdn"

          - task: AzureStaticWebApp@0
            displayName: Deploy independent static welcome page
            inputs:
              app_location: '.welcome-dist'
              output_location: ''
              skip_app_build: true
              skip_api_build: true
              azure_static_web_apps_api_token: $(welcomeDeploymentToken)

          - script: |
              curl --fail --silent --show-error --max-time 30 "https://$(welcomeSiteHostname)/" -o /dev/null
            displayName: Smoke check static welcome page

          - task: AzureCLI@2
            displayName: Smoke check (cold start tolerant)
            inputs:
              azureSubscription: RecipeLibrary-Azure-SEC
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                fqdn="$(containerAppFqdn)"
                if [ -z "$fqdn" ] || [ "$fqdn" = "null" ]; then
                  fqdn="$(az containerapp show --resource-group "$(resourceGroupName)" --name "$(containerAppName)" --query properties.configuration.ingress.fqdn -o tsv)"
                fi

                health_url="https://${fqdn}/health/live"
                home_url="https://${fqdn}/"
                readiness_url="https://${fqdn}/api/system/readiness"
                echo "Health URL: $health_url"
                echo "Home URL: $home_url"
                echo "Readiness URL: $readiness_url"

                max_attempts=30
                sleep_seconds=20
                for attempt in $(seq 1 "$max_attempts"); do
                  health_code="$(curl --silent --show-error --max-time 60 -o /dev/null -w "%{http_code}" "$health_url" || echo "000")"
                  echo "Attempt ${attempt}/${max_attempts}: GET /health/live -> HTTP ${health_code}"
                  if [ "$health_code" != "200" ]; then
                    sleep "$sleep_seconds"
                    continue
                  fi

                  home_headers="$(mktemp)"
                  home_code="$(curl --silent --show-error --max-time 60 -D "$home_headers" -o /dev/null -w "%{http_code}" "$home_url" || echo "000")"
                  location="$(awk 'tolower($1)=="location:" {print $2}' "$home_headers" | tr -d '\r')"
                  rm -f "$home_headers"
                  echo "GET / -> HTTP ${home_code} Location=${location:-none}"

                  readiness_body="$(curl --silent --show-error --max-time 60 "$readiness_url" || echo "")"
                  echo "GET /api/system/readiness -> ${readiness_body}"

                  if echo "$readiness_body" | grep -Eqi '"state"[[:space:]]*:[[:space:]]*"Failed"'; then
                    echo "Smoke check failed: persistence permanently failed (see /failed and app logs)."
                    exit 1
                  fi

                  if echo "$readiness_body" | grep -Eqi '"state"[[:space:]]*:[[:space:]]*"Ready"'; then
                    # Anonymous / is 200 only without auth; with Identity it redirects to login.
                    if [ "$home_code" = "200" ] || { [ "$home_code" = "302" ] && echo "$location" | grep -Eqi '/Account/Login'; }; then
                      echo "Smoke check passed (app ready)."
                      exit 0
                    fi
                    echo "Readiness Ready but unexpected GET / response; retrying..."
                  else
                    echo "Waiting for persistence Ready..."
                  fi

                  sleep "$sleep_seconds"
                done

                echo "Smoke check failed after ${max_attempts} attempts."
                echo "Check /api/system/readiness and container logs. If SQL auth fails for the app identity, run docs/azure/sql-grants.sql and redeploy."
                exit 1

# NEU does not run on automatic CI. Start it manually via Run pipeline and enable "Deploy NEU".
# Uses existing environment test-neu (no environment approval required for this pattern).
- stage: DeployTestNEU
  displayName: Deploy test NEU (manual)
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'), ${{ parameters.deployNeu }})
  variables:
    containerImageDigest: $[ stageDependencies.Build.BuildAndTest.outputs['PublishImage.containerImageDigest'] ]
  jobs:
  - deployment: DeployTestNEU
    displayName: Deploy test NEU
    environment: test-neu
    variables:
      azureLocation: northeurope
      resourceGroupName: rg-recipelibrary-test-neu
      environmentName: test-neu
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: Checkout repository

          - task: AzureCLI@2
            displayName: Deploy Bicep infrastructure
            inputs:
              azureSubscription: RecipeLibrary-Azure-NEU
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                az bicep install

                if [ -z "$(containerImageDigest)" ]; then
                  echo "containerImageDigest is empty. Ensure the GHCR publish step ran on main."
                  exit 1
                fi

                echo "Verifying resource group exists (pipeline does not create RGs)..."
                az group show --name "$(resourceGroupName)" >/dev/null

                # Preserve existing hostname/certificate bindings in this region too.
                current_app="$(az containerapp list -g "$(resourceGroupName)" --query "[?starts_with(name, 'ca-rl-')].name | [0]" -o tsv)"
                domains='[]'
                if [ -n "$current_app" ]; then
                  domains="$(az containerapp show -g "$(resourceGroupName)" -n "$current_app" -o json | jq '.properties.configuration.ingress.customDomains // []')"
                fi
                domain_parameters="$(Agent.TempDirectory)/app-domains.json"
                jq -n --argjson domains "$domains" '{appCustomDomains: {value: ($domains // [])}}' > "$domain_parameters"

                deployment_name="main-$(Build.BuildId)"
                outputs="$(az deployment group create \
                  --name "$deployment_name" \
                  --resource-group "$(resourceGroupName)" \
                  --template-file infra/main.bicep \
                  --parameters "@$domain_parameters" \
                    location="$(azureLocation)" \
                    projectName="$(projectName)" \
                    environment="$(environmentName)" \
                    tenantId="$(AZURE_TENANT_ID)" \
                    entraAdminLogin="$(AZURE_ENTRA_ADMIN_LOGIN)" \
                    entraAdminObjectId="$(AZURE_ENTRA_ADMIN_OBJECT_ID)" \
                    ghcrImageRepository="$(ghcrImageRepository)" \
                    containerImageDigest="$(containerImageDigest)" \
                    ghcrUsername="$(GHCR_USERNAME)" \
                    ghcrPassword="$(GHCR_TOKEN)" \
                  --query properties.outputs -o json)"

                container_app_name="$(echo "$outputs" | jq -r '.containerAppName.value')"
                container_app_fqdn="$(echo "$outputs" | jq -r '.containerAppFqdn.value')"
                key_vault_name="$(echo "$outputs" | jq -r '.keyVaultName.value')"
                echo "Deployed Container App: $container_app_name"
                echo "Container App FQDN: $container_app_fqdn"
                echo "Key Vault: $key_vault_name"
                echo "##vso[task.setvariable variable=containerAppName]$container_app_name"
                echo "##vso[task.setvariable variable=containerAppFqdn]$container_app_fqdn"
                echo "##vso[task.setvariable variable=keyVaultName]$key_vault_name"

          - task: AzureCLI@2
            displayName: Smoke check (cold start tolerant)
            inputs:
              azureSubscription: RecipeLibrary-Azure-NEU
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                fqdn="$(containerAppFqdn)"
                if [ -z "$fqdn" ] || [ "$fqdn" = "null" ]; then
                  fqdn="$(az containerapp show --resource-group "$(resourceGroupName)" --name "$(containerAppName)" --query properties.configuration.ingress.fqdn -o tsv)"
                fi

                health_url="https://${fqdn}/health/live"
                home_url="https://${fqdn}/"
                readiness_url="https://${fqdn}/api/system/readiness"
                echo "Health URL: $health_url"
                echo "Home URL: $home_url"
                echo "Readiness URL: $readiness_url"

                max_attempts=30
                sleep_seconds=20
                for attempt in $(seq 1 "$max_attempts"); do
                  health_code="$(curl --silent --show-error --max-time 60 -o /dev/null -w "%{http_code}" "$health_url" || echo "000")"
                  echo "Attempt ${attempt}/${max_attempts}: GET /health/live -> HTTP ${health_code}"
                  if [ "$health_code" != "200" ]; then
                    sleep "$sleep_seconds"
                    continue
                  fi

                  home_headers="$(mktemp)"
                  home_code="$(curl --silent --show-error --max-time 60 -D "$home_headers" -o /dev/null -w "%{http_code}" "$home_url" || echo "000")"
                  location="$(awk 'tolower($1)=="location:" {print $2}' "$home_headers" | tr -d '\r')"
                  rm -f "$home_headers"
                  echo "GET / -> HTTP ${home_code} Location=${location:-none}"

                  readiness_body="$(curl --silent --show-error --max-time 60 "$readiness_url" || echo "")"
                  echo "GET /api/system/readiness -> ${readiness_body}"

                  if echo "$readiness_body" | grep -Eqi '"state"[[:space:]]*:[[:space:]]*"Failed"'; then
                    echo "Smoke check failed: persistence permanently failed (see /failed and app logs)."
                    exit 1
                  fi

                  if echo "$readiness_body" | grep -Eqi '"state"[[:space:]]*:[[:space:]]*"Ready"'; then
                    # Anonymous / is 200 only without auth; with Identity it redirects to login.
                    if [ "$home_code" = "200" ] || { [ "$home_code" = "302" ] && echo "$location" | grep -Eqi '/Account/Login'; }; then
                      echo "Smoke check passed (app ready)."
                      exit 0
                    fi
                    echo "Readiness Ready but unexpected GET / response; retrying..."
                  else
                    echo "Waiting for persistence Ready..."
                  fi

                  sleep "$sleep_seconds"
                done

                echo "Smoke check failed after ${max_attempts} attempts."
                echo "Check /api/system/readiness and container logs. If SQL auth fails for the app identity, run docs/azure/sql-grants.sql and redeploy."
                exit 1
